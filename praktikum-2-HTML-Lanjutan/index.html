<h1>Form Registrasi Mahasiswa</h1>

    <input type="email" id="email" name="email"><br><br>
    <label for="password">PASSWORD</label><br>

    <input type="date" id="tanggal" name="tanggal"><br><br>
    <button type="submit" value="Daftar">Daftar</button>
